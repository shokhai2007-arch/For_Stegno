name: Build Linux Executable Professional

on:
  push:
    branches: [ main ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:

  build:
    name: Build StegoVault Linux Binary
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-tk \
            libgl1 \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Linux Icon
        shell: python
        run: |
          import os
          from PIL import Image

          logo_path = 'static/image/logo.png'

          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.png')
              print("Linux icon prepared successfully.")
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --clean stegovault.spec

      - name: Verify Linux Binary
        run: |
          if [ -f "dist/StegoVault" ]; then
            echo "Success: Linux binary found."
            chmod +x dist/StegoVault
          else
            echo "Error: Linux binary NOT found!"
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux
          path: dist/StegoVault
          retention-days: 5


  test:
    name: Test Linux Binary
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: StegoVault-Linux
          path: dist

      - name: Make Binary Executable
        run: |
          chmod +x dist/StegoVault

      - name: Smoke Test Binary
        run: |
          ./dist/StegoVault --help || true

      - name: Confirm Binary Exists
        run: |
          if [ -f "dist/StegoVault" ]; then
            echo "Binary test passed."
          else
            echo "Binary test failed."
            exit 1
          fi


  release:
    name: Create Linux Release
    runs-on: ubuntu-latest

    needs: test

    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: StegoVault-Linux
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StegoVault Linux Release ${{ github.ref_name }}
          files: dist/StegoVault
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
