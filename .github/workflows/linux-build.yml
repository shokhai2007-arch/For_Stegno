name: Build Linux DEB Package

on:
  push:
    branches: [ linux-build ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:
  build-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Package Structure
        run: |
          # Paket ichidagi papkalarni yaratish
          mkdir -p package/usr/share/stegovault
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications

          # Loyiha fayllarini nusxalash
          cp -r . package/usr/share/stegovault/

          # Ishga tushiruvchi wrapper script yaratish
          echo '#!/bin/bash' > package/usr/bin/stegovault
          echo 'cd /usr/share/stegovault && python3 app.py "$@"' >> package/usr/bin/stegovault
          chmod +x package/usr/bin/stegovault

      - name: Create Desktop Entry
        run: |
          # Ilovalar menyusida ko'rinishi uchun .desktop fayli
          cat <<EOF > package/usr/share/applications/stegovault.desktop
          [Desktop Entry]
          Name=StegoVault
          Comment=Steganography tool for secure data hiding
          Exec=/usr/bin/stegovault
          Icon=/usr/share/stegovault/static/image/logo.png
          Terminal=false
          Type=Application
          Categories=Utility;Security;
          EOF

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n stegovault \
            -v 1.0.0 \
            -C package \
            -p stegovault_1.0.0_amd64.deb \
            --depends python3 \
            --depends python3-tk \
            --description "StegoVault - Image Steganography tool" \
            usr/bin usr/share/stegovault usr/share/applications

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: "*.deb"
          retention-days: 5