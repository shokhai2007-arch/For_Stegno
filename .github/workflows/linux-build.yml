name: Build Linux Executable Professional

on:
  push:
    branches: [ main ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:

  checkout-repo:
    name: Checkout Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

  setup-python:
    name: Setup Python & Install Dependencies
    runs-on: ubuntu-latest
    needs: checkout-repo
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

  generate-icon:
    name: Generate Linux Icon
    runs-on: ubuntu-latest
    needs: setup-python
    steps:
      - name: Generate Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.png')
              print("Linux icon prepared successfully.")
          else:
              print(f"Warning: {logo_path} not found.")

  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    needs: generate-icon
    steps:
      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build DEB package
        run: |
          mkdir -p deb_dist
          # dist/your_main_script.py → /usr/local/bin/stegovault
          cp main.py dist/stegovault
          chmod +x dist/stegovault
          fpm -s dir -t deb -n stegovault -v 1.0.0 --prefix /usr/local/bin dist/stegovault

  upload-deb:
    name: Upload DEB Artifact
    runs-on: ubuntu-latest
    needs: build-deb
    steps:
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault_*.deb
          retention-days: 5