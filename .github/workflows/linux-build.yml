name: Build Linux DEB Package

on:
  push:
    branches: [ main ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:
  build-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow fpm

      - name: Prepare package structure
        run: |
          mkdir -p package/usr/share/stegovault
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications

          # Loyiha fayllarini nusxalash, package papkasini chiqarib tashlab
          rsync -av --exclude='package' ./ package/usr/share/stegovault/

          # Wrapper script
          echo '#!/bin/bash' > package/usr/bin/stegovault
          echo 'cd /usr/share/stegovault && python3 app.py "$@"' >> package/usr/bin/stegovault
          chmod +x package/usr/bin/stegovault

          # Desktop entry
          cat <<EOF > package/usr/share/applications/stegovault.desktop
          [Desktop Entry]
          Name=StegoVault
          Comment=Digital Steganography Vault
          Exec=/usr/bin/stegovault
          Icon=/usr/share/stegovault/static/image/logo.png
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

      - name: Build DEB package
        run: |
          fpm -s dir -t deb -n stegovault -v 1.0.0 \
              --prefix /usr \
              -C package \
              usr/bin usr/share

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault_*.deb
          retention-days: 5