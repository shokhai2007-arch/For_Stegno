name: Build Linux DEB Package

on:
  push:
    branches: [ linux-build ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:
  build-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Generate Linux Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.png')
              print("Linux icon prepared successfully.")
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build DEB package
        run: |
          mkdir -p deb_dist
          cp main.py dist/stegovault
          chmod +x dist/stegovault
          fpm -s dir -t deb -n stegovault -v 1.0.0 --prefix /usr/local/bin dist/stegovault

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault_*.deb
          retention-days: 5