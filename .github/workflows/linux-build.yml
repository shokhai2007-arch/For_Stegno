name: Build Linux DEB Package

on:
  push:
    branches: [ main ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:
  build-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow fpm

      - name: Prepare Package Structure
        run: |
          # 1. Toza va vaqtinchalik papka yaratamiz (loyiha ichida emas)
          mkdir -p ../package/usr/share/stegovault
          mkdir -p ../package/usr/bin
          mkdir -p ../package/usr/share/applications

          # 2. Hamma fayllarni nusxalash (faqat kerakli qismlarni)
          # 'package' papkasini o'z ichiga olmasligi uchun 'cp' buyrug'ini to'g'ri beramiz
          cp -r . ../package/usr/share/stegovault/
          
          # Keraksiz git va vaqtinchalik fayllarni o'chirib tashlaymiz (ixtiyoriy, lekin tavsiya etiladi)
          rm -rf ../package/usr/share/stegovault/.git
          rm -rf ../package/usr/share/stegovault/.github

          # 3. Wrapper script yaratish
          echo '#!/bin/bash' > ../package/usr/bin/stegovault
          echo 'cd /usr/share/stegovault && python3 app.py "$@"' >> ../package/usr/bin/stegovault
          chmod +x ../package/usr/bin/stegovault

          # 4. Desktop entry yaratish (bu bosqichni ham shu yerga qo'shing)
          cat <<EOF > ../package/usr/share/applications/stegovault.desktop
          [Desktop Entry]
          Name=StegoVault
          Exec=/usr/bin/stegovault
          Icon=/usr/share/stegovault/static/image/logo.png
          Type=Application
          Categories=Utility;
          EOF

      - name: Build DEB package
        run: |
          # FPM endi tashqaridagi 'package' papkasidan foydalanadi
          fpm -s dir -t deb \
            -n stegovault \
            -v 1.0.0 \
            -C ../package \
            -p stegovault_1.0.0_amd64.deb \
            --depends python3 \
            --depends python3-tk \
            usr

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault_*.deb
          if-no-files-found: warn