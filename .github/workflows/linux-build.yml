name: Build Linux DEB Package

on:
  push:
    branches: [ main ]
    tags:
      - 'linux_v*'
  workflow_dispatch: {}

jobs:
  build-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          # fpm-ni pip orqali emas, gem orqali o'rnatish ishonchliroq
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pillow

      - name: Prepare Package Structure
        run: |
          # 1. Loyihadan tashqarida vaqtinchalik papka yaratish
          mkdir -p ../package/usr/share/stegovault
          mkdir -p ../package/usr/bin
          mkdir -p ../package/usr/share/applications

          # 2. Loyiha fayllarini nusxalash
          cp -r . ../package/usr/share/stegovault/
          
          # Keraksiz papkalarni tozalash
          rm -rf ../package/usr/share/stegovault/.git
          rm -rf ../package/usr/share/stegovault/.github

          # 3. Wrapper script yaratish
          cat <<EOF > ../package/usr/bin/stegovault
          #!/bin/bash
          cd /usr/share/stegovault && python3 app.py "\$@"
          EOF
          chmod +x ../package/usr/bin/stegovault

          # 4. Desktop entry yaratish (App listda ko'rinishi uchun)
          cat <<EOF > ../package/usr/share/applications/stegovault.desktop
          [Desktop Entry]
          Name=StegoVault
          Comment=Steganography Tool
          Exec=/usr/bin/stegovault
          Icon=/usr/share/stegovault/static/image/logo.png
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

      - name: Build DEB package
        run: |
          # Paket hozirgi ishchi papkada (root) yaratiladi
          fpm -s dir -t deb \
            -n stegovault \
            -v 1.0.0 \
            -C ../package \
            -p stegovault.deb \
            --depends python3 \
            --depends python3-tk \
            --description "StegoVault Image Steganography Tool" \
            usr

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault.deb
          if-no-files-found: error