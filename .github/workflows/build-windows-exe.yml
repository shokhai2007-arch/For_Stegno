name: Build Windows EXE Professional

on:
  push:
    branches: [ windows-build ]
    tags:
      - 'windows_v*'
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Windows Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
              print("logo.ico generated successfully.")
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build Standalone EXE
        run: pyinstaller --clean stegovault.spec

      - name: Test EXE Existence
        shell: pwsh
        run: |
          if (Test-Path "dist/StegoVault.exe") {
            Write-Host "Success: Executable found at dist/StegoVault.exe"
          } else {
            Write-Host "Error: Executable NOT found!"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Windows
          path: dist/StegoVault.exe
          retention-days: 5