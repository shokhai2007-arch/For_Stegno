name: Main Release Workflow

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'linux_v*'
      - 'windows_v*'
  workflow_dispatch: {}

jobs:
  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Package Structure
        run: |
          # Paket ichidagi papkalarni yaratish
          mkdir -p package/usr/share/stegovault
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/applications

          # Loyiha fayllarini nusxalash
          cp -r . package/usr/share/stegovault/

          # Ishga tushiruvchi wrapper script yaratish
          echo '#!/bin/bash' > package/usr/bin/stegovault
          echo 'cd /usr/share/stegovault && python3 app.py "$@"' >> package/usr/bin/stegovault
          chmod +x package/usr/bin/stegovault

      - name: Create Desktop Entry
        run: |
          # Ilovalar menyusida ko'rinishi uchun .desktop fayli
          cat <<EOF > package/usr/share/applications/stegovault.desktop
          [Desktop Entry]
          Name=StegoVault
          Comment=Steganography tool for secure data hiding
          Exec=/usr/bin/stegovault
          Icon=/usr/share/stegovault/static/image/logo.png
          Terminal=false
          Type=Application
          Categories=Utility;Security;
          EOF

      - name: Build DEB package
        run: |
          fpm -s dir -t deb \
            -n stegovault \
            -v 1.0.0 \
            -C package \
            -p stegovault_1.0.0_amd64.deb \
            --depends python3 \
            --depends python3-tk \
            --description "StegoVault - Image Steganography tool" \
            usr/bin usr/share/stegovault usr/share/applications

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: "*.deb"
          retention-days: 5

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Windows Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build EXE
        run: pyinstaller --clean stegovault.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 5

  create-release:
    needs: [build-linux, build-windows]
    if: success()
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found. Skipping release."
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "Tag found: $TAG"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Download Artifacts
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: Release ${{ steps.check_tag.outputs.tag_name }}
          files: |
            dist/linux-build/*.deb
            dist/windows-build/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}