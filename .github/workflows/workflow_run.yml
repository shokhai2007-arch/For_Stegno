name: Main Release Workflow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  check-tag:
    name: Check Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_status: ${{ steps.check_tag.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Barcha tarixni yuklash
          fetch-tags: true   # Barcha taglarni yuklash (MUHIM!)
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Check Current Commit Tag
        id: check_tag
        shell: bash
        run: |
          # Mahalliy taglarni yangilab olish (ba'zan GitHub Actions uchun shart)
          git fetch --tags --force
          
          CURRENT_TAG=$(git tag --points-at HEAD | grep "^v" | head -n 1 || echo "")
          
          if [ -n "$CURRENT_TAG" ]; then
            echo "✅ Joriy commitda tag topildi: $CURRENT_TAG"
            echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Joriy commitda tag topilmadi."
            echo "status=missing" >> $GITHUB_OUTPUT
            # Bump stepiga o'tishi uchun bu yerda exit 1 qilmaymiz!
          fi

      - name: Bump and Push New Tag
        if: steps.check_tag.outputs.status == 'missing'
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v1.0.0")
          VERSION_NUM=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          NEW_TAG="v$major.$minor.$((patch + 1))"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          
          echo "🚀 Yangi tag push qilindi: $NEW_TAG"
          exit 1 # Build boshlanmasligi uchun to'xtatamiz

  build-linux:
    needs: check-tag
    if: success()
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pillow

      - name: Build Linux Package
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: "*.deb"
          if-no-files-found: error
          retention-days: 5

  build-windows:
    needs: check-tag
    if: success()
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller pillow

      - name: Generate Windows Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build EXE
        run: pyinstaller --clean stegovault.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 5

  create-release:
    needs: [check-tag, build-linux, build-windows]
    if: success()
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Current Tag
        id: get_tag
        run: |
          TAG=$(git tag --points-at HEAD | grep "^v" | head -n 1)
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: Release ${{ steps.get_tag.outputs.tag_name }}
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}