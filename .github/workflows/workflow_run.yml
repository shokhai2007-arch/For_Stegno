name: Main Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # manual ishga tushirish

jobs:
  wait-for-builds:
    name: Wait for Linux & Windows Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check other workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflowsToWait = ["Build Linux Executable", "Build Windows EXE Professional"];
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const workflowName of workflowsToWait) {
              console.log(`Checking latest run for workflow: ${workflowName}`);
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowName,
                branch: "main",
                status: "completed",
                per_page: 1
              });

              if (!runs.data.workflow_runs.length) {
                throw new Error(`No completed runs found for workflow ${workflowName}`);
              }

              const latestRun = runs.data.workflow_runs[0];
              console.log(`Latest run for ${workflowName} finished with conclusion: ${latestRun.conclusion}`);

              if (latestRun.conclusion !== "success") {
                throw new Error(`Workflow ${workflowName} did not succeed. Conclusion: ${latestRun.conclusion}`);
              }
            }

  collect-artifacts:
    name: Download Build Artifacts
    runs-on: ubuntu-latest
    needs: wait-for-builds
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: collect-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/windows/*
            dist/linux/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
