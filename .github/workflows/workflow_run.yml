name: Main Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  codeql-analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  check_tag:
    name: Check/Create Tag
    runs-on: ubuntu-latest
    needs: codeql-analyze
    outputs:
      tag_name: ${{ steps.tag_check.outputs.tag_name }}
      has_tag: ${{ steps.tag_check.outputs.has_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag exists or create from date
        id: tag_check
        run: |
          # Joriy commit uchun tag'ni tekshir
          CURRENT_TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          
          if [ -z "$CURRENT_TAG" ]; then
            # Tag yo'q bo'lsa, sana bilan tag yaratiladi
            TAG_NAME="v$(date +%Y.%m.%d)"
            echo "has_tag=false" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Tag mavjud emas. Sana tag'i yaratilyapti: $TAG_NAME"
          else
            # Tag mavjud bo'lsa
            echo "has_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=$CURRENT_TAG" >> $GITHUB_OUTPUT
            echo "Tag mavjud: $CURRENT_TAG"
          fi

      - name: Create and push tag if not exists
        if: steps.tag_check.outputs.has_tag == 'false'
        run: |
          TAG_NAME=${{ steps.tag_check.outputs.tag_name }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    needs: check_tag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Linux Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.png')
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build DEB package
        run: |
          mkdir -p dist
          cp app.py dist/stegovault
          chmod +x dist/stegovault
          fpm -s dir -t deb -n stegovault -v 1.0.0 --prefix /usr/local/bin dist/stegovault

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: stegovault_*.deb
          retention-days: 5

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: check_tag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Windows Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build EXE
        run: pyinstaller --clean stegovault.spec

      - name: Test EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/StegoVault.exe")) { exit 1 }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/StegoVault.exe
          retention-days: 5

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, check_tag]
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_tag.outputs.tag_name }}
          name: Release ${{ needs.check_tag.outputs.tag_name }}
          body_path: realise_note.md
          files: |
            dist/linux/*
            dist/windows/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
