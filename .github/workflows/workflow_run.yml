name: Main Release Workflow

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'linux_v*'
      - 'windows_v*'
  workflow_dispatch: {}

jobs:
  check-and-handle-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_status: ${{ steps.check_tag.outputs.status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Current Commit Tag
        id: check_tag
        shell: bash
        run: |
          # Joriy commitda tag borligini tekshirish
          CURRENT_TAG=$(git tag --points-at HEAD | grep "v*" | head -n 1)
          
          if [ -n "$CURRENT_TAG" ]; then
            echo "✅ Joriy commitda tag topildi: $CURRENT_TAG"
            echo "status=exists" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Joriy commitda tag topilmadi."
            echo "status=missing" >> $GITHUB_OUTPUT
          fi

      - name: Bump and Push New Tag
        if: steps.check_tag.outputs.status == 'missing'
        shell: bash
        run: |
          # Oxirgi mavjud tagni olish (tarixdan)
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "v1.0.0")
          echo "Oxirgi topilgan tag: $LATEST_TAG"
          
          # Versiyani oshirish (v1.0.4 -> 1.0.4 -> 1.0.5)
          VERSION_NUM=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION_NUM"
          NEW_PATCH=$((patch + 1))
          NEW_TAG="v$major.$minor.$NEW_PATCH"
          
          echo "Yangi tag yaratilmoqda: $NEW_TAG"
          
          # Git sozlamalari va push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          
          echo "🚀 Yangi tag push qilindi. Ushbu workflow to'xtatiladi."
          echo "Yangi tag push qilingani sababli yangi workflow ishga tushadi."
          exit 1 # Build jarayoniga o'tmaslik uchun to'xtatish

  build-linux:
    needs: check-and-handle-tag
    name: Build Linux DEB Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-tk libgl1 libglib2.0-0 ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pillow

      - name: Build Linux Package
        run: |
          # Skriptga ruxsat berish va uni ishga tushirish
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StegoVault-Linux-DEB
          path: stegovault.deb
          if-no-files-found: error
          retention-days: 5

  build-windows:
    needs: check-and-handle-tag
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Windows Icon
        shell: python
        run: |
          import os
          from PIL import Image
          logo_path = 'static/image/logo.png'
          if os.path.exists(logo_path):
              img = Image.open(logo_path)
              img.save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          else:
              print(f"Warning: {logo_path} not found.")

      - name: Build EXE
        run: pyinstaller --clean stegovault.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
          retention-days: 5

  create-release:
    needs: [build-linux, build-windows]
    if: success()
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG=$(git describe --exact-match --tags 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found. Skipping release."
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "Tag found: $TAG"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Download Artifacts
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: Release ${{ steps.check_tag.outputs.tag_name }}
          files: |
            dist/linux-build/*.deb
            dist/windows-build/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}